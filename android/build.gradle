buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Ensure all Android subprojects (including plugins) use consistent JVM targets.
subprojects { project ->
    project.plugins.withId('com.android.application') {
        project.android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    project.plugins.withId('com.android.library') {
        project.android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '17'
        }
    }

    // Some plugins override compileOptions late; enforce again when safe.
    def configureCompatibility = {
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null && androidExt.hasProperty('compileOptions')) {
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }

    if (project.state.executed) {
        configureCompatibility()
    } else {
        project.afterEvaluate {
            configureCompatibility()
        }
    }

    // Ensure JavaCompile tasks don't fall back to 1.8 defaults.
    project.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }
}

// Compatibility fallback for older plugins missing AGP namespace declarations.
subprojects { project ->
    def configureNamespace = {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null && androidExt.hasProperty("namespace")) {
            def currentNamespace = androidExt.namespace
            if (currentNamespace == null || currentNamespace.toString().trim().isEmpty()) {
                def fallbackNamespace = (project.group != null && project.group.toString().trim()) ?
                    project.group.toString() :
                    "com.autogen.${project.name.replace('-', '_')}"
                androidExt.namespace = fallbackNamespace
            }
        }
    }

    if (project.state.executed) {
        configureNamespace()
    } else {
        project.afterEvaluate {
            configureNamespace()
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
